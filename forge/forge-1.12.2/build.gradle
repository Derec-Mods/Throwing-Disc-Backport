buildscript {
	repositories {
		maven { url = 'https://files.minecraftforge.net/maven' }
		mavenCentral()
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.194'
	}
	configurations.classpath {
		resolutionStrategy {
			force 'net.minecraftforge:mergetool:0.2.3.3'
		}
	}
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = "${project.mod_version}-${project.minecraft_version}-${project.modloader}"
group = 'io.github.derexxd'
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
	sourceCompatibility = targetCompatibility = '1.8'
	options.encoding = 'UTF-8'
}

sourceSets {
	main {
		output.resourcesDir = output.classesDir
		resources {
			srcDirs = [
				project.file("src/main/resources"),
				project.file("../../shared")
			]
			exclude "assets/renders/**"
			exclude "assets/screenshots/**"
			exclude "data/**"
		}
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	baseName = project.archives_base_name
	version = "${project.mod_version}-${project.minecraft_version}-${project.modloader}"
}

minecraft {
	mappings channel: 'snapshot', version: '20171003-1.12'

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
		}
		server {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
		}
	}
}

configurations.configureEach {
	exclude group: 'net.minecraftforge', module: 'mergetool'
}

dependencies {
	minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

jar {
	exclude 'net/minecraftforge/fml/relauncher/Side.class'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'mcversion', '1.12.2'
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	from(sourceSets.main.resources.srcDirs) {
		include 'mcmod.info'
		expand 'version': project.version, 'mcversion': '1.12.2'
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude 'mcmod.info'
		exclude 'assets/renders/**'
		exclude 'assets/screenshots/**'
		exclude 'data/**'
	}
}

tasks.whenTaskAdded { task ->
	if (task.name == 'runClient' || task.name == 'runServer') {
		task.dependsOn 'classes'
	}
}

classes.doLast {
	copy {
		from "build/resources/main"
		into "build/classes/java/main"
	}
}
